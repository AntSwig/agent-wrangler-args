name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Side by side, not nested: validate-manifest.mjs copies this checkout into a fake
# extensions dir and runs the loader's import scan over it, so agent-wrangler must
# not live inside it.
defaults:
  run:
    working-directory: agent-wrangler-args

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AW_REPO: ${{ github.workspace }}/agent-wrangler
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-wrangler-args
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: PortSwigger/agent-wrangler
          ref: main
          path: agent-wrangler
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-wrangler/package-lock.json

      - run: npm ci --ignore-scripts
        working-directory: agent-wrangler

      - run: node scripts/validate-manifest.mjs

      - run: npm test
